<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
</head>
<body>
    <h1>Sign In</h1>
    <form action="sign in.html" method="post">
        <label for="username">Email:</label> <br> <br>

        <input type="email" id="username" name="username" required placeholder="Enter your email"><br><br>
        
        <label for="password">Password:</label> <br> <br>
        <input type="password" id="password" name="password" required placeholder="Enter your password"><br><br>
        
        <input type="submit" value="Sign In">
    </form>
</body>
</html>
